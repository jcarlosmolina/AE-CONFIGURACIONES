apiVersion: apps/v1
kind: Deployment
metadata:
  name: ae-configuraciones
  labels:
    app: ae-configuraciones
    app.kubernetes.io/component: ae-configuraciones
    app.kubernetes.io/instance: ae-configuraciones
    app.kubernetes.io/name: ae-configuraciones
    app.kubernetes.io/part-of: ae-app
    app.openshift.io/runtime: ae-configuraciones
spec:
# Set the desired number of replicas
  replicas: 1
  selector:
    matchLabels:
      app: ae-configuraciones
  template:
    metadata:
      labels:
        app: ae-configuraciones
        deployment: ae-configuraciones
    spec:
      containers:
        - name: ae-configuraciones
# Replace the placeholder below with the name of your OpenShift namespace/project
          image: 'image-registry.openshift-image-registry.svc:5000/soporte-colsanitas-dev/ae-configuraciones:latest'
          ports:
            - containerPort: 8082
              protocol: TCP
          env:
# Replace the TZ env variable with your desired timezone. For a list of valid timezones see https://www.iana.org/time-zones
          - name: TZ
            value: 'America/Bogota'
          - name: quarkus.datasource.jdbc.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-database-jdbc-url
          - name: quarkus.datasource.username
            valueFrom:
              secretKeyRef:
                name: ae-secret
                key: db-username
          - name: quarkus.datasource.password
            valueFrom:
              secretKeyRef:
                name: ae-secret
                key: db-password
          - name: quarkus.rest-client.ae-apigateway.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-apigateway-url
          - name: quarkus.rest-client.ae-usuarios.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-usuarios-url
          - name: quarkus.rest-client.ae-configuraciones.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-configuraciones-url
          - name: quarkus.rest-client.ae-reportes.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-reportes-url
          - name: quarkus.rest-client.ae-firmas.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-firmas-url
          - name: quarkus.rest-client.ae-personas.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-personas-url
          - name: quarkus.rest-client.ae-solicitudes.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-solicitudes-url
          - name: quarkus.rest-client.ae-novedades.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-novedades-url
          - name: quarkus.rest-client.ae-generasolicitud.url
